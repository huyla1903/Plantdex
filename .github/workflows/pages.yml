# Checks the app, then publishes it (repo root, no build step) to GitHub Pages on every
# push to main. tools/check.mjs fails on broken JS or data, and then nothing is deployed.
# Repo Settings -> Pages -> Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check sources and data (stops the deploy on errors)
        run: node tools/check.mjs
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html app.js app.css data.js sw.js manifest.webmanifest donate.jpg icons _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
